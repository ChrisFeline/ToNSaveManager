name: .NET Core Desktop

on:
  push:
    branches: [ "main", "dev", "test", "linux" ]
    paths-ignore:
      - '**.md'  # Ignore markdown files
      - '**.png' # Ignore image files
      - '**.bat' # Ignore batch files
      - '**.gif' # Ignore gif files
      - '**.yml' # Ignore yaml files

jobs:

  version:

    runs-on: ubuntu-latest

    outputs:
      date: ${{ steps.get_date.outputs.date }}

    steps:
    - name: Get the date
      id: get_date
      run: |
        $timestamp = Get-Date -Format "yyyy.M.d"
        $time = [int]((Get-Date) - (Get-Date).Date).TotalMinutes
        echo "date=$timestamp.$time" >> "$env:GITHUB_OUTPUT"
      shell: pwsh

  build:

    needs: version

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: ToNSaveManager.sln
      Project_Name: ToNSaveManager.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Add MSBuild to the PATH
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Update project version
      run: |
        $date = "${{ needs.version.outputs.date }}"
        $csprojPath = "${{ env.Project_Name }}"
        $csproj = Get-Content $csprojPath -Raw
        $csproj = $csproj -replace '<Version>.*?</Version>', "<Version>$date</Version>"
        $csproj = $csproj -replace '<FileVersion>.*?</FileVersion>', "<FileVersion>$date</FileVersion>"
        Set-Content -Path $csprojPath -Value $csproj
      shell: pwsh

    - name: Update Terrors index data
      run: |
          $data = "${{ secrets.TERROR_INDEX_DATA }}"
          [System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String($data)) | Out-File -Encoding "UTF8" "./Resources/index.json"
      shell: pwsh

    # Build the application
    - name: Build the application
      run: dotnet publish $env:Project_Name -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true --property:PublishDir=./publish
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Zip Artifact
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ToNSaveManager.zip -Update

    # Upload the build artifacts just in case
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ToNSaveManager
        path: ToNSaveManager.zip

  build-linux:

    needs: version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install appimagetool
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        wget -q -O "$RUNNER_TEMP/bin/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x "$RUNNER_TEMP/bin/appimagetool"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Build the AppImage
      env:
        INDEX_DATA: ${{ secrets.TERROR_INDEX_DATA }}
        APPIMAGE_EXTRACT_AND_RUN: 1 # No FUSE on the runner
      run: |
        set -- --version "${{ needs.version.outputs.date }}"
        if [ -n "$INDEX_DATA" ]; then
          echo "$INDEX_DATA" | base64 -d > "$RUNNER_TEMP/index.json"
          set -- "$@" --index "$RUNNER_TEMP/index.json"
        fi
        ./ToNSaveManager.Avalonia/build-appimage.sh "$@"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ToNSaveManager-Linux
        path: artifacts/ToNSaveManager-x86_64.AppImage

  release:

    needs: [version, build, build-linux]
    if: startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: .
        merge-multiple: true

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.version.outputs.date }}
        name: Release ${{ needs.version.outputs.date }}
        body: |
          # [Download](https://github.com/ChrisFeline/ToNSaveManager/releases/latest/download/ToNSaveManager.zip)
          ### [Download for Linux (AppImage)](https://github.com/ChrisFeline/ToNSaveManager/releases/latest/download/ToNSaveManager-x86_64.AppImage)

          [changelog]: <> (START)
          ### Changes in this release
          -

          [changelog]: <> (END)

          **NOTE:** If you are unsure what to do, go check the [README](https://github.com/ChrisFeline/ToNSaveManager/blob/main/README.md#how-do-i-use-this), basically just extract and run.

          ### If you already downloaded and want to update an old release you have these options:
          * Click on `Settings`, then click `Check For Updates`.
          * If previous option doesn't work, open the file `update.bat`, the new files will be downloaded.
        draft: true
        prerelease: false
        files: |
          ./ToNSaveManager.zip
          ./ToNSaveManager-x86_64.AppImage